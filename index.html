<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const clone=x=>JSON.parse(JSON.stringify(x));
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CATS=[['tiktok','TikToks por hacer'],['juego','Juegos por hacer'],['pregunta','Preguntas por hacer'],['actividad','Pinturas y actividades'],['visitar','Lugares para visitar'],['comer','Comer, merendar y almorzar']];
const PROMPTS=['Contame un detalle chiquito que te hizo feliz esta semana.','¿Qué lugar te gustaría conocer conmigo?','Elijan una canción y escúchenla juntos, aunque estén lejos.','Completá: «Mi recuerdo favorito con vos es…»','¿Qué comida les gustaría preparar juntos?','Mandale un audio contando algo que te encanta de estar juntos.','Saquen una foto de un momento simple, de esos que importan.','Inventen una tradición que quieran repetir cada año.'];
const KEY='nosotros-web-v1', DBNAME='nosotros-web-fotos-v1';
const iso=d=>`${String(d.getFullYear()).padStart(4,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=k=>{const [y,m,d]=k.split('-').map(Number);const t=new Date(0);t.setHours(12,0,0,0);t.setFullYear(y,m-1,d);return t;};
const dateAt=(y,m,d=1)=>{const t=new Date(0);t.setHours(12,0,0,0);t.setFullYear(y,m,d);return t;};
const validDate=k=>typeof k==='string'&&/^\d{4,6}-\d{2}-\d{2}$/.test(k)&&iso(parseDate(k))===k;
const fd=k=>parseDate(k).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const today=()=>iso(new Date());
const catName=c=>CATS.find(a=>a[0]===c)?.[1]||'Actividad';
const icon=(name,cls='icon')=>`<svg class="${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const EMPTY=()=>({version:1,events:[],ideas:[],photos:[],days:{},notes:{},collage:{template:0,caption:'Nuestros días favoritos',slots:{}},settings:{theme:'auto'}});
let preservedRaw=null, corruptState=false;
let state=EMPTY(), images={}, db=null, storageOK=true, loading=true, view='home', filter='all', pendingEvent=null, cur=dateAt(new Date().getFullYear(),new Date().getMonth()), modalReturn=null;
let cropDraft=null, collageDrawToken=0;
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
function storageError(message){storageOK=false;const n=$('#storageWarning');n.hidden=false;n.textContent=message+' Exportá una copia antes de cerrar esta página.';}
function commit(next){return Shared.commit(next);}

function update(fn){const next=clone(state);fn(next);return commit(next);}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<12;i++){const el=document.createElement('span');el.className='celebrate';el.textContent='♥';el.style.cssText=`--x:${(Math.random()-.5)*300}px;--y:${-90-Math.random()*180}px;--r:${Math.random()*90-45}deg;`;document.body.append(el);setTimeout(()=>el.remove(),1400);}}
function modal(title,body){const d=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;if(!d.open){modalReturn=document.activeElement;d.showModal();}d.scrollTop=0;const focusTarget=$('#modalBody [autofocus]');if(focusTarget)focusTarget.focus();}
function closeModal(){const d=$('#modal');if(d.open)d.close();if(modalReturn?.isConnected)modalReturn.focus();}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
function go(v){if(loading){toast('Estamos abriendo sus recuerdos…');return;}if(!['home','cal','ideas','photos','collage','settings'].includes(v))return;view=v;$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));$$('[data-nav]').forEach(b=>{if(b.dataset.nav===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});renderView();$('#main').scrollTop=0;}
function renderView(){({home:renderHome,cal:renderCalendar,ideas:renderIdeas,photos:renderPhotos,collage:renderCollage,settings:renderSettings})[view]();}
function refresh(){renderView();}
function actualTheme(){const setting=state.settings.theme==='auto'?CONFIG.tema:state.settings.theme;return setting==='auto'?(CONFIG.mesesFiestas.includes(new Date().getMonth()+1)?'fiestas':'romantico'):setting;}
function setTheme(){document.body.dataset.season=actualTheme();document.querySelector('meta[name=theme-color]').content=actualTheme()==='fiestas'?'#6d0a18':'#572637';$('#fx').innerHTML='';if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<15;i++){const f=document.createElement('span');f.className='flake';f.textContent=actualTheme()==='fiestas'?'✦':'♥';f.style.cssText=`left:${Math.random()*100}%;font-size:${8+Math.random()*9}px;animation-duration:${12+Math.random()*12}s;animation-delay:-${Math.random()*20}s`;$('#fx').append(f);}}
function skipWelcome(){const w=$('#welcome');if(w.classList.contains('out'))return;w.classList.add('out');w.setAttribute('aria-hidden','true');w.inert=true;$('#main').removeAttribute('inert');$('.nav').removeAttribute('inert');$('.top').removeAttribute('inert');$('.nav button').focus({preventScroll:true});}
$('#welcomeTitle').textContent=CONFIG.nombres.join(' & ');$('#welcomeMessage').textContent=CONFIG.bienvenida;$('#couple').textContent=CONFIG.nombres.join(' & ')+' · de a dos, siempre';
$('#main').setAttribute('inert','');$('.nav').setAttribute('inert','');$('.top').setAttribute('inert','');$('#welcome').focus();$('#welcome').addEventListener('click',skipWelcome);$('#welcome').addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' ')skipWelcome();});$('#welcome .progress i').style.animationDuration=CONFIG.bienvenidaMs+'ms';setTimeout(skipWelcome,Math.max(5000,Math.min(6000,CONFIG.bienvenidaMs)));
function shiftMonth(n){cur=dateAt(cur.getFullYear(),cur.getMonth()+n);refresh();}
function monthBar(){return `<div class="monthbar"><button class="iconbtn" aria-label="Mes anterior" onclick="shiftMonth(-1)">‹</button><h2>${MONTHS[cur.getMonth()]} ${cur.getFullYear()}</h2><button class="iconbtn" aria-label="Mes siguiente" onclick="shiftMonth(1)">›</button></div>`;}
function activeEvents(k){return state.events.filter(e=>e.date===k&&e.status!=='cancelled');}
function renderHome(){const next=state.events.filter(e=>e.date>=today()&&e.status==='planned').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];const nextMeet=Object.keys(state.days).filter(k=>state.days[k].meet&&k>=today()).sort()[0];const nextDate=[next?.date,nextMeet].filter(Boolean).sort()[0];const count=state.ideas.filter(i=>!i.done).length;$('#v-home').innerHTML=`
<div class="lights" aria-hidden="true">${'<i></i>'.repeat(18)}</div><div class="home-intro"><div><h2>Lo lindo es compartirlo.</h2><p class="muted">Un plan pendiente, una foto, una excusa para vernos.<br>Este pedacito del mundo es nuestro.</p></div>${icon(actualTheme()==='fiestas'?'art-tree':'art-love','love-art')}</div>
<div class="tiles">
<button class="tile cal-tile wide" onclick="go('cal')"><div><strong>Nuestro calendario</strong><br><small>${MONTHS[cur.getMonth()]} ${cur.getFullYear()} · armemos un plan</small></div><span class="tile-date">${new Date().getDate()}</span>${icon('i-cal','tile-art')}</button>
<button class="tile plans-tile tall" onclick="filter='all';go('ideas')"><strong>Planes<br>por hacer</strong>${icon('art-cups','tile-art')}<small class="bottomline">${count?count+' ideas esperando su momento':'Las mejores ideas empiezan acá'}</small></button>
<button class="tile photo-tile tall" onclick="go('photos')"><strong>Nuestras<br>Polaroids</strong><div class="mini-polaroids">${icon('i-heart')}</div><small class="bottomline">${state.photos.length?state.photos.length+' recuerdos guardados':'Momentos para volver a mirar'}</small></button>
<button class="tile collage-tile wide" onclick="go('collage')"><strong>Un recuerdo<br>en papel</strong><small>Collages A4 para imprimir</small>${icon('i-collage','tile-art')}</button>
<button class="tile question-tile wide" onclick="surprise()"><strong>Sorprendeme</strong><small>Una idea para nuestra próxima vez</small>${icon('art-letter','tile-art')}</button>
<button class="tile note-tile" onclick="daily()"><strong>${actualTheme()==='fiestas'?'Pequeños regalos':'Nuestro ritual'}</strong><small class="caption">Un detalle cada día</small></button>
<button class="tile" style="background:var(--pist)" onclick="filter='visitar';go('ideas')"><strong>Lugares</strong><small class="caption">Nos quedan tantos por descubrir</small></button>
</div><div class="summary">${icon('i-heart')}<div><strong>${nextDate?(nextDate===today()?'Hoy nos toca compartir':'Nuestra próxima cita'):'¿Cuándo nos vemos?'}</strong><p>${nextDate?esc(fd(nextDate))+(next?.date===nextDate?' · '+esc(next.title):''):'Marquen un día y regálense algo de tiempo.'}</p></div></div><p class="footer-note">Lo cotidiano, con vos, es extraordinario.</p>`;}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return dateAt(y,Math.floor(n/31)-1,n%31+1);}
function holiday(k){const exact=CONFIG.feriados.find(h=>h.fecha===k||h.fecha===k.slice(-5));if(exact)return {name:exact.nombre,review:false};if(CONFIG.calcularCarnavalYPascua){const year=parseDate(k).getFullYear(),e=easter(year);for(const [offset,name] of [[-48,'Lunes de Carnaval'],[-47,'Martes de Carnaval'],[-2,'Viernes Santo']]){const d=new Date(e);d.setDate(d.getDate()+offset);if(iso(d)===k)return {name,review:false};}}const r=CONFIG.feriadosARevisar.find(h=>h.fecha===k.slice(-5));return r?{name:r.nombre,review:true}:null;}
function renderCalendar(){const y=cur.getFullYear(),m=cur.getMonth(),f=(dateAt(y,m).getDay()+6)%7,n=dateAt(y,m+1,0).getDate();let cells='<span aria-hidden="true"></span>'.repeat(f);let holidays=[];for(let d=1;d<=n;d++){const t=dateAt(y,m,d),k=iso(t),hol=holiday(k),ev=activeEvents(k),meet=state.days[k]?.meet||ev.length;const free=t.getDay()===0||hol&&!hol.review;if(hol)holidays.push({k,...hol});cells+=`<button class="day${free?' free':''}${meet?' meet':''}${k===today()?' today':''}${hol?.review?' review':''}" aria-label="${esc(fd(k)+(hol?' · '+hol.name:'')+(meet?' · encuentro o actividad':'')+(ev.length?' · '+ev.length+' actividades':''))}" ${k===today()?'aria-current="date"':''} onclick="openDay('${k}')">${d}<small>${meet?'♥'+(ev.length>1?' '+ev.length:''):hol?'·':''}</small></button>`;}
const events=state.events.filter(e=>e.date.startsWith(iso(cur).slice(0,-2)) ).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('#v-cal').innerHTML=`<div class="sectionhead row between"><div><h2>Nuestros días</h2><p>Siempre hay una buena excusa para vernos.</p></div><button class="btn" onclick="eventForm()">＋ Agregar actividad</button></div><div class="calendar-layout"><div>${monthBar()}<div class="calendar weekdays">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${cells}</div><div class="legend"><span><i class="dot"></i>Domingo / feriado</span><span><i class="dot pink"></i>Encuentro / plan</span><span><i class="dot gold"></i>Hoy / revisar traslado</span></div><button class="textbtn" onclick="cur=dateAt(new Date().getFullYear(),new Date().getMonth());refresh()">Volver al mes actual</button>${holidays.length?`<ul class="holiday-list">${holidays.map(h=>`<li>${parseDate(h.k).getDate()}: ${esc(h.name)}</li>`).join('')}</ul>`:''}<p class="muted" style="margin-top:12px">Los feriados trasladables y puentes se confirman cada año. Editalos en CONFIG con fechas exactas.</p></div><div><h3>Planes de ${MONTHS[m]}</h3>${events.length?events.map(eventCard).join(''):'<div class="empty">Este mes todavía es una página en blanco.<br>¿La llenamos de buenos momentos?</div>'}</div></div>`;}
function eventCard(e){return `<article class="event ${e.status==='done'?'done':e.status==='cancelled'?'cancelled':''}"><small>${esc(fd(e.date))}${e.time?' · '+esc(e.time):''}</small><b>${esc(e.title)}</b><div class="status">${esc(catName(e.category))} · ${e.status==='done'?'Hecha ✓':e.status==='cancelled'?'Cancelada':'Por compartir'}</div>${e.notes?`<p style="font-size:14px;white-space:pre-wrap">${esc(e.notes)}</p>`:''}<div class="actions"><button onclick="eventForm('${e.id}')">Editar</button><button onclick="eventStatus('${e.id}','${e.status==='done'?'planned':'done'}')">${e.status==='done'?'Reabrir':'Hecha ✓'}</button>${e.status!=='cancelled'?`<button onclick="eventStatus('${e.id}','cancelled')">Cancelar plan</button>`:`<button onclick="eventStatus('${e.id}','planned')">Restaurar</button>`}<button onclick="deleteEvent('${e.id}')">Eliminar</button></div></article>`;}
function openDay(k){const ev=state.events.filter(e=>e.date===k);modal(fd(k),`<button class="btn full ${state.days[k]?.meet?'primary':'soft'}" onclick="toggleMeet('${k}')">${state.days[k]?.meet?'♥ Nos vemos este día':'♡ Marcar que nos vemos'}</button>${holiday(k)?`<p class="muted" style="margin:12px 0">${esc(holiday(k).name)}</p>`:''}${ev.map(eventCard).join('')||'<p class="muted" style="margin:18px 0">Todavía no hay actividades para este día.</p>'}<button class="btn primary full" onclick="eventForm(null,'${k}')">＋ Agregar actividad</button><label class="field" for="daynote">Una nota para recordar</label><textarea id="daynote" maxlength="5000">${esc(state.days[k]?.note||'')}</textarea><button class="btn soft full" style="margin-top:10px" onclick="saveDayNote('${k}')">Guardar nota</button>`);}
function saveDayNote(k){const note=$('#daynote').value;if(update(s=>{s.days[k]={...(s.days[k]||{}),note};})){toast('Nota guardada');refresh();}}
function toggleMeet(k){if(update(s=>{s.days[k]={...(s.days[k]||{}),meet:!s.days[k]?.meet};})){refresh();openDay(k);}}
function eventForm(id=null,k=null,ideaId=null){const e=state.events.find(e=>e.id===id),idea=state.ideas.find(i=>i.id===ideaId);pendingEvent=null;modal(e?'Editar actividad':idea?'De idea a plan':'Nueva actividad',`<form id="eventForm"><label class="field" for="eventTitle">¿Qué quieren hacer?</label><input id="eventTitle" name="title" required maxlength="180" placeholder="Ir al Cerro San Javier" value="${esc(e?.title||idea?.title||'')}" autofocus><div class="form-grid"><div><label class="field" for="eventDate">Fecha</label><input id="eventDate" name="date" type="date" required value="${esc(e?.date||k||today())}"></div><div><label class="field" for="eventTime">Hora (opcional)</label><input id="eventTime" name="time" type="time" value="${esc(e?.time||'')}"></div></div><label class="field" for="eventCategory">Categoría</label><select id="eventCategory" name="category">${CATS.map(([c,n])=>`<option value="${c}" ${c===(e?.category||idea?.category||'actividad')?'selected':''}>${n}</option>`).join('')}</select><label class="field" for="eventNotes">Notas (opcional)</label><textarea id="eventNotes" name="notes" maxlength="5000" placeholder="Qué llevamos, dónde nos encontramos…">${esc(e?.notes||idea?.url||'')}</textarea><div class="form-actions"><button type="button" class="btn soft" onclick="closeModal()">Volver</button><button type="submit" class="btn primary">Guardar actividad</button></div></form>`);$('#eventForm').onsubmit=event=>{event.preventDefault();const f=new FormData(event.target);const data={id:e?.id||uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),category:f.get('category'),notes:f.get('notes').trim(),status:e?.status||'planned',ideaId:e?.ideaId||ideaId||null};if(!data.title||!validDate(data.date))return toast('Revisá el título y la fecha.');pendingEvent=data;checkConflict();};}
function checkConflict(){const conflicts=state.events.filter(e=>e.id!==pendingEvent.id&&e.date===pendingEvent.date&&e.status!=='cancelled');if(!conflicts.length||pendingEvent.status==='cancelled')return finishEvent('both');modal('Ese día ya tienen un plan',`<p>El ${esc(fd(pendingEvent.date))} ya tienen:</p><div class="quote" style="font-size:20px">${conflicts.map(e=>esc(e.title)+(e.time?' · '+esc(e.time):'')).join('<br>')}</div><p>¿Qué quieren hacer con «${esc(pendingEvent.title)}»?</p><div class="stack" style="margin-top:20px"><button class="btn primary" onclick="finishEvent('replace')">Reemplazar · conservar anterior como cancelado</button><button class="btn soft" onclick="finishEvent('both')">Mantener ambas actividades</button><button class="btn ghost" onclick="pendingEvent=null;closeModal()">Cancelar · no guardar cambios</button></div><p class="muted" style="margin-top:14px">Reemplazar no elimina el historial de ese día.</p>`);}
function finishEvent(mode){if(!pendingEvent)return;const e=clone(pendingEvent);if(update(s=>{if(mode==='replace')s.events.filter(x=>x.date===e.date&&x.id!==e.id&&x.status!=='cancelled').forEach(x=>x.status='cancelled');const idx=s.events.findIndex(x=>x.id===e.id);if(idx<0)s.events.push(e);else s.events[idx]=e;})){cur=dateAt(parseDate(e.date).getFullYear(),parseDate(e.date).getMonth());pendingEvent=null;closeModal();refresh();toast('Un nuevo momento para compartir. Guardado ♥');}}
function eventStatus(id,status){const e=state.events.find(e=>e.id===id);if(!e)return;if(status==='planned'&&e.status==='cancelled'){pendingEvent={...e,status};return checkConflict();}if(update(s=>s.events.find(x=>x.id===id).status=status)){if(status==='done')celebrate();refresh();if($('#modal').open)openDay(e.date);toast(status==='done'?'Otro lindo recuerdo juntos ♥':'Actividad actualizada');}}
function deleteEvent(id){const e=state.events.find(e=>e.id===id);if(!e||!confirm(`¿Eliminar definitivamente «${e.title}»? Para conservarlo, elegí Cancelar plan.`))return;if(update(s=>s.events=s.events.filter(x=>x.id!==id))){refresh();if($('#modal').open)openDay(e.date);toast('Actividad eliminada');}}
function renderIdeas(){const all=state.ideas.filter(i=>filter==='all'||i.category===filter).sort((a,b)=>Number(a.done)-Number(b.done));$('#v-ideas').innerHTML=`<div class="sectionhead row between"><div><h2>${filter==='visitar'?'Lugares por descubrir':'Para cuando nos veamos'}</h2><p>Que ninguna buena idea se pierda en el chat.</p></div><button class="btn" onclick="ideaForm()">＋ Agregar idea</button></div><div class="chips" aria-label="Categorías"><button aria-pressed="${filter==='all'}" onclick="filter='all';renderIdeas()">Todas</button>${CATS.map(([c,n])=>`<button aria-pressed="${filter===c}" onclick="filter='${c}';renderIdeas()">${n} · ${state.ideas.filter(i=>i.category===c&&!i.done).length}</button>`).join('')}</div><button class="textbtn" onclick="surprise()">Elegir una idea al azar</button>${all.map(i=>{const assigned=state.events.filter(e=>e.ideaId===i.id&&e.status!=='cancelled');return `<article class="idea${i.done?' done':''}"><button class="check" role="checkbox" aria-checked="${i.done}" aria-label="${i.done?'Marcar pendiente':'Marcar hecha'}: ${esc(i.title)}" onclick="toggleIdea('${i.id}')">${i.done?'✓':''}</button><div class="body"><small>${esc(catName(i.category))}</small><b>${esc(i.title)}</b>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" class="textbtn" style="display:inline-flex;align-items:center">Abrir enlace ↗</a>`:''}${assigned.length?`<small style="display:block">En calendario: ${assigned.map(e=>esc(fd(e.date))).join(' · ')}</small>`:''}<div class="row"><button class="textbtn" onclick="eventForm(null,null,'${i.id}')">Asignar a un día</button><button class="textbtn" onclick="ideaForm('${i.id}')">Editar</button><button class="textbtn" onclick="deleteIdea('${i.id}')">Eliminar</button></div></div></article>`;}).join('')||'<div class="empty">¿Un TikTok, una merienda, una pregunta?<br>Guardá acá lo primero que se te ocurra.</div>'}`;}
function safeURL(s){if(!s)return '';try{const u=new URL(s);if(!['https:','http:'].includes(u.protocol))return null;return u.href;}catch(e){return null;}}
function ideaForm(id=null){const i=state.ideas.find(x=>x.id===id);modal(i?'Editar idea':'Una idea para los dos',`<form id="ideaForm"><label class="field" for="ideaTitle">Idea</label><input id="ideaTitle" name="title" required maxlength="500" value="${esc(i?.title||'')}" placeholder="Pintar un cuadro juntos" autofocus><label class="field" for="ideaCategory">Categoría</label><select id="ideaCategory" name="category">${CATS.map(([c,n])=>`<option value="${c}" ${c===(i?.category||(filter==='all'?'actividad':filter))?'selected':''}>${n}</option>`).join('')}</select><label class="field" for="ideaURL">Enlace (opcional)</label><input id="ideaURL" name="url" type="url" placeholder="https://…" maxlength="2000" value="${esc(i?.url||'')}"><p class="muted">TikTok, Instagram, un lugar o cualquier inspiración.</p><div class="form-actions"><button class="btn soft" type="button" onclick="closeModal()">Volver</button><button class="btn primary" type="submit">Guardar idea</button></div></form>`);$('#ideaForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim(),url=safeURL(f.get('url').trim());if(!title)return toast('Escribí la idea primero.');if(url===null)return toast('Usá un enlace que empiece con https:// o http://');const item={id:i?.id||uid(),title,category:f.get('category'),url,done:i?.done||false};if(update(s=>{const idx=s.ideas.findIndex(x=>x.id===item.id);if(idx<0)s.ideas.unshift(item);else s.ideas[idx]=item;})){closeModal();refresh();toast('Idea guardada para la próxima ♥');}};}

function deleteIdea(id){const i=state.ideas.find(x=>x.id===id);if(!i||!confirm(`¿Eliminar la idea «${i.title}»? Los planes ya asignados al calendario se conservan.`))return;if(update(s=>{s.ideas=s.ideas.filter(x=>x.id!==id);s.events.forEach(e=>{if(e.ideaId===id)e.ideaId=null;});})){refresh();toast('Idea eliminada');}}

function daily(){const year=cur.getFullYear(),month=cur.getMonth(),count=dateAt(year,month+1,0).getDate();modal(actualTheme()==='fiestas'?'Pequeños regalos diarios':'Un detalle cada día',`<p>Un mensaje, una pregunta, una pausa para nosotros. Navegá el mes desde el calendario.</p><p class="muted" style="margin-top:8px">${MONTHS[month]} ${year} · los días futuros se abren cuando llega su fecha.</p><div class="daily-grid">${Array.from({length:count},(_,i)=>{const k=iso(dateAt(year,month,i+1));return `<button ${k>today()?'disabled':''} onclick="dailyNote('${k}')" aria-label="Regalo del ${esc(fd(k))}">${i+1}${state.notes[k]?' ♥':''}</button>`;}).join('')}</div>`);}

// IndexedDB: las fotos no consumen la cuota pequeña de localStorage. Nunca se envían a ningún servidor.
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB no disponible'));const q=indexedDB.open(DBNAME,1);q.onupgradeneeded=()=>q.result.createObjectStore('photos');q.onsuccess=()=>{db=q.result;db.onversionchange=()=>db.close();resolve();};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(new Error('Cerrá otras pestañas de esta página e intentá de nuevo.'));});}
function photoTransaction(fn){return new Promise((resolve,reject)=>{if(!db)return reject(new Error('El almacenamiento de fotos no está disponible.'));const tx=db.transaction('photos','readwrite');try{fn(tx.objectStore('photos'));}catch(e){tx.abort();reject(e);return;}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('No se pudo guardar la foto.'));});}
function allPhotos(){return new Promise((resolve,reject)=>{if(!db)return resolve({});const out={},tx=db.transaction('photos','readonly'),q=tx.objectStore('photos').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue();}};tx.oncomplete=()=>resolve(out);tx.onerror=()=>reject(tx.error);});}
async function shrink(file){if(file.size>45*1024*1024)throw new Error('La foto supera 45 MB. Elegí una más pequeña.');const url=URL.createObjectURL(file),im=new Image();try{im.src=url;await im.decode();const scale=Math.min(1,CONFIG.maxFotoPx/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',CONFIG.calidadFoto);}catch(e){throw new Error('No pudimos leer la foto. Probá JPG, PNG o WebP; HEIC depende de tu navegador.');}finally{URL.revokeObjectURL(url);}}
let uploading=false;
async function uploadPhotos(files,slot=null){if(uploading)return toast('Esperá a que termine la carga actual.');if(!db)return toast('Las fotos necesitan almacenamiento habilitado. Revisá Ajustes.');uploading=true;$$('.upload').forEach(x=>x.setAttribute('aria-busy','true'));toast('Preparando sus fotos…');const added=[];try{for(const f of [...files].slice(0,20)){try{const data=await shrink(f),id=uid(),photo={id,caption:'',date:today(),rotation:Math.random()*6-3};await photoTransaction(store=>store.put(data,id));if(!update(s=>s.photos.unshift(photo))){await photoTransaction(store=>store.delete(id));break;}images[id]=data;added.push(id);}catch(e){toast(e.message);}}if(added.length){if(slot!==null){const id=added[0];update(s=>{const list=s.collage.slots[s.collage.template]||(s.collage.slots[s.collage.template]=[]);list[slot]={photoId:id,x:50,y:50,zoom:1};});closeModal();}refresh();toast(`${added.length} ${added.length===1?'foto guardada':'fotos guardadas'} ♥`);}}finally{uploading=false;$$('.upload').forEach(x=>x.removeAttribute('aria-busy'));}}
function uploadControl(text='Agregar fotos',slot=null){return `<label class="upload"><span>${text}</span><input type="file" accept="image/*" ${slot===null?'multiple':''} style="position:absolute;width:1px;height:1px;opacity:0;left:0;top:0;overflow:hidden;clip-path:inset(50%)" aria-label="${text}" onchange="uploadPhotos(this.files,${slot===null?'null':slot});this.value=''" ${!db?'disabled':''}></label>`;}
function renderPhotos(){$('#v-photos').innerHTML=`<div class="sectionhead row between"><div><h2>Instantes nuestros</h2><p>Esas fotos que nunca nos cansamos de mirar.</p></div>${uploadControl()}</div><div class="row between"><p class="muted">${state.photos.length} recuerdos · tocá una foto para editar su leyenda</p><button class="textbtn" onclick="go('collage')">Crear un collage A4 →</button></div>${!db?'<div class="notice warn">No se pudo abrir IndexedDB. Habilitá el almacenamiento del navegador para guardar fotos.</div>':''}<div class="gallery">${state.photos.map(p=>`<button class="polaroid" style="--r:${p.rotation}deg" onclick="photoDetail('${p.id}')" aria-label="Editar foto: ${esc(p.caption||'Sin leyenda')}">${images[p.id]?`<img src="${images[p.id]}" alt="${esc(p.caption||'Un recuerdo nuestro')}" loading="lazy">`:'<div class="empty">Foto no disponible en este navegador</div>'}<span>${esc(p.caption||'Un día con vos…')}</span></button>`).join('')||'<div class="empty">Todavía no hay fotos.<br>Subí la primera y empecemos este álbum.</div>'}</div>`;}
function photoDetail(id){const p=state.photos.find(x=>x.id===id);if(!p)return;modal('Un recuerdo nuestro',`${images[id]?`<img class="photo-detail" src="${images[id]}" alt="${esc(p.caption||'Foto de la galería')}">`:''}<form id="photoForm"><label class="field" for="photoCaption">Leyenda</label><input id="photoCaption" maxlength="300" value="${esc(p.caption)}" placeholder="¿Qué queremos recordar de este día?"><div class="form-actions"><button type="button" class="btn danger" onclick="deletePhoto('${id}')">Eliminar foto</button><button class="btn primary">Guardar leyenda</button></div></form>`);$('#photoForm').onsubmit=e=>{e.preventDefault();const caption=$('#photoCaption').value;if(update(s=>s.photos.find(x=>x.id===id).caption=caption)){closeModal();refresh();toast('Leyenda guardada');}};}
async function deletePhoto(id){if(!confirm('¿Eliminar esta foto de la galería y de todos los collages?'))return;const old=images[id];try{await photoTransaction(store=>store.delete(id));if(!update(s=>{s.photos=s.photos.filter(p=>p.id!==id);Object.values(s.collage.slots).forEach(slots=>slots.forEach((slot,i)=>{if(slot?.photoId===id)slots[i]=null;}));})){if(old)await photoTransaction(store=>store.put(old,id));return;}delete images[id];closeModal();refresh();toast('Foto eliminada');}catch(e){toast('No se pudo eliminar la foto. Intentá de nuevo.');}}

function renderCollage(){const c=state.collage;$('#v-collage').innerHTML=`<div class="sectionhead"><h2>Un recuerdo en papel</h2><p>Elegí un diseño. Tocá cada marco para poner una foto y acomodarla.</p></div><div class="collage-layout"><div><div class="chips" aria-label="Plantillas">${TEMPLATES.map((t,i)=>`<button aria-pressed="${i===c.template}" onclick="changeTemplate(${i})">${t.name}</button>`).join('')}</div><div class="sheet-wrap"><div class="sheet" id="collageSheet"><canvas id="collageCanvas" width="1240" height="1754" aria-label="Vista previa del collage en proporción A4"></canvas>${TEMPLATES[c.template].slots.map(([x,y,w,r],i)=>`<button class="slot-hit" style="left:${x}%;top:${y}%;width:${w}%;height:${w*1.2*210/297}%;transform:rotate(${r}deg)" onclick="pickSlot(${i})" aria-label="${currentSlots()[i]?.photoId?'Editar':'Elegir'} foto ${i+1}">${!currentSlots()[i]?.photoId?'<span>＋ Foto '+(i+1)+'</span>':''}</button>`).join('')}</div></div></div><div class="paper"><h3>Hecho para guardar</h3><p class="muted">Hasta ${TEMPLATES[c.template].slots.length} fotos por diseño. Cada plantilla conserva sus propias fotos y encuadres.</p><label class="field" for="collageCaption">Leyenda del collage</label><input id="collageCaption" maxlength="120" value="${esc(c.caption)}" placeholder="Nuestros días favoritos" oninput="saveCollageCaption(this.value)"><p class="muted" style="margin:12px 0 20px">La vista previa, el PNG y la hoja impresa usan el mismo diseño. Las líneas y adornos ya están incluidos en la imagen.</p><div class="stack"><button class="btn primary" onclick="printCollage()">Imprimir / Guardar PDF · A4</button><button class="btn soft" onclick="downloadPNG()">Descargar imagen PNG</button>${uploadControl('Subir más fotos')}<button class="textbtn" onclick="clearTemplate()">Vaciar esta plantilla</button></div><p class="muted" style="margin-top:18px">Al imprimir: A4, escala 100%, márgenes ninguno y encabezados/pies desactivados. En iPhone usá Compartir → Imprimir → ampliar const decoded=new Map();
async function loadImage(data){if(!data)throw new Error('Foto no disponible');if(decoded.has(data))return decoded.get(data);const p=new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('No se pudo decodificar la imagen'));im.src=data;});decoded.set(data,p);return p;}
function drawCropped(ctx,im,x,y,w,h,crop){const scale=Math.max(w/im.naturalWidth,h/im.naturalHeight)*(crop.zoom||1),dw=im.naturalWidth*scale,dh=im.naturalHeight*scale;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(im,x-(dw-w)*(crop.x??50)/100,y-(dh-h)*(crop.y??50)/100,dw,dh);ctx.restore();}
function drawHeart(ctx,x,y,size,color){ctx.save();ctx.translate(x,y);ctx.scale(size/24,size/24);ctx.beginPath();ctx.moveTo(12,21);ctx.bezierCurveTo(-6,10,3,-3,12,6);ctx.bezierCurveTo(21,-3,30,10,12,21);ctx.fillStyle=color;ctx.fill();ctx.restore();}
function fitText(ctx,text,maxWidth,start,min){let size=start;do{ctx.font=`italic ${size}px Georgia`;}while(ctx.measureText(text).width>maxWidth&&--size>min);return size;}
function wrapCanvasText(ctx,text,maxWidth){const words=text.split(/\s+/),lines=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){lines.push(line);line=word;}else line=next;}if(line)lines.push(line);return lines;}
async function drawScene(canvas,snapshot=clone(state.collage)){const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,template=TEMPLATES[snapshot.template],slots=snapshot.slots[snapshot.template]||[],loaded=await Promise.all(slots.map(s=>s?.photoId&&images[s.photoId]?loadImage(images[s.photoId]).catch(()=>null):null));ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff1e0';ctx.fillRect(0,0,W,H);for(let y=18;y<H;y+=25){for(let x=18;x<W;x+=25){ctx.fillStyle='#ead4c033';ctx.fillRect(x/W*W,y/W*W,1,1);}}const band=H*.012;for(let x=0;x<W;x+=W*.05){ctx.fillStyle=((Math.round(x/(W*.05))%2)===0)?'#b01228':'#ffc6e0';ctx.fillRect(x,0,W*.05,band);ctx.fillRect(x,H-band,W*.05,band);}drawHeart(ctx,W*.04,H*.39,W*.035,'#dba0b0');drawHeart(ctx,W*.91,H*.38,W*.045,'#b01228');drawHeart(ctx,W*.47,H*.91,W*.026,'#b01228');
for(let i=0;i<template.slots.length;i++){const [px,py,pw,r]=template.slots[i],x=W*px/100,y=H*py/100,w=W*pw/100,h=w*1.2,pad=w*.045,imgSize=w-pad*2;ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(r*Math.PI/180);ctx.translate(-w/2,-h/2);ctx.fillStyle='#d1b4a4';ctx.fillRect(3,5,w,h);ctx.fillStyle='#fffaf3';ctx.fillRect(0,0,w,h);ctx.fillStyle='#f5d9e2';ctx.fillRect(pad,pad,imgSize,imgSize);if(loaded[i])drawCropped(ctx,loaded[i],pad,pad,imgSize,imgSize,slots[i]);else{drawHeart(ctx,w*.41,w*.40,w*.18,'#d996b0');ctx.fillStyle='#94566b';ctx.textAlign='center';ctx.font=`${w*.052}px Georgia`;ctx.fillText('un instante nuestro',w/2,w*.74);}const caption=state.photos.find(p=>p.id===slots[i]?.photoId)?.caption||'';if(caption){ctx.fillStyle='#6d0a18';ctx.textAlign='center';fitText(ctx,caption,w*.86,w*.065,w*.032);let str=caption;if(ctx.measureText(str).width>w*.86){while(str.length&&ctx.measureText(str+'…').width>w*.86)str=str.slice(0,-1);str+='…';}ctx.fillText(str,w/2,h-w*.08);}ctx.fillStyle=i%2?'#8fd3b6a8':'#e8b85aa8';ctx.fillRect(w*.3,-w*.025,w*.4,w*.075);ctx.restore();}
ctx.fillStyle='#6d0a18';ctx.textAlign='center';const size=fitText(ctx,snapshot.caption,W*.86,W*.055,W*.029);const lines=wrapCanvasText(ctx,snapshot.caption,W*.86);lines.slice(0,2).forEach((line,i)=>ctx.fillText(line,W/2,H*.947+i*size*1.15));return canvas;}
async function drawPreview(){const token=++collageDrawToken,canvas=$('#collageCanvas');if(!canvas)return;const off=document.createElement('canvas');off.width=1240;off.height=1754;await drawScene(off);if(token===collageDrawToken&&canvas.isConnected)canvas.getContext('2d').drawImage(off,0,0);}
function hasCollagePhotos(){return currentSlots().some(s=>s?.photoId&&images[s.photoId]);}
async function makeCollageCanvas(){const c=document.createElement('canvas');c.width=2480;c.height=3508;await drawScene(c);return c;}
async function printCollage(){if(!hasCollagePhotos())return toast('Elegí al menos una foto para imprimir su collage.');try{toast('Preparando la hoja A4…');const c=await makeCollageCanvas(),im=new Image();im.src=c.toDataURL('image/png');await im.decode();$('#printArea').replaceChildren(im);closeModal();requestAnimationFrame(()=>window.print());}catch(e){toast('No se pudo preparar la impresión. Probá descargar PNG.');}}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}
async function downloadPNG(){if(!hasCollagePhotos())return toast('Elegí al menos una foto para descargar su collage.');try{const c=await makeCollageCanvas();c.toBlob(b=>{if(!b)return toast('No se pudo crear el PNG.');downloadBlob(b,'nuestro-collage-'+today()+'.png');toast('Imagen PNG lista ♥');},'image/png');}catch(e){toast('No se pudo crear la imagen.');}}
function renderSettings(){$('#v-settings').innerHTML=`<div class="sectionhead"><h2>Cuidemos nuestros recuerdos</h2><p>Lo importante merece una copia de seguridad.</p></div>${corruptState?'<div class="notice warn" style="margin-bottom:20px">Los datos locales están dañados o pertenecen a otra versión. No se sobrescribirán. <button class="btn" onclick="downloadRecovery()">Descargar datos para recuperar</button> Después podés importar un respaldo válido.</div>':''}<div class="settings-grid"><div class="paper"><h3>Este rincón vive acá</h3><div class="notice">La página está publicada en GitHub Pages, pero <b>sus planes y fotos se guardan solo en este navegador y dispositivo</b>. No se sincronizan solos entre celulares. Exporten el archivo JSON y pásenselo para tener la misma información.</div><p class="muted" style="margin-top:14px">El sitio y su código son públicos; los recuerdos que cargan no se publican. No es una app con contraseña ni cifrado: cualquiera con acceso a este perfil del navegador podría verlos. Borrar los datos del sitio, el modo privado o cambiar de navegador puede hacer que los pierdan.</p><p class="muted" style="margin-top:14px">Guardados: ${state.events.length} actividades, ${state.ideas.length} ideas y ${state.photos.length} fotos. ${db?'IndexedDB disponible.':'IndexedDB no disponible: las fotos no se pueden guardar.'}</p><div class="stack" style="margin-top:20px"><button class="btn primary" onclick="exportData()">Exportar datos completos (.json)</button><button class="btn soft" onclick="$('#importFile').click()">Importar copia (.json)</button></div><p class="muted" style="margin-top:12px">El respaldo incluye las fotos, las notas y todos los collages. Importar reemplaza los datos locales, no combina cambios. Antes se descarga automáticamente una copia del estado actual.</p></div><div class="paper"><h3>Un rincón para todo el año</h3><label class="field" for="themeSelect">Tema</label><select id="themeSelect" onchange="changeTheme(this.value)"><option value="auto" ${state.settings.theme==='auto'?'selected':''}>Según CONFIG / temporada</option><option value="fiestas" ${state.settings.theme==='fiestas'?'selected':''}>Fiestas · luces y pequeños regalos</option><option value="romantico" ${state.settings.theme==='romantico'?'selected':''}>Romántico · todos nuestros días</option></select><p class="muted" style="margin-top:12px">En automático, noviembre a enero se visten de fiesta. El resto del año, el mismo rincón se vuelve más tranquilo y romántico.</p><h3 style="margin-top:26px">Nombres y feriados</h3><p class="muted">Editá el objeto <b>CONFIG</b>, al principio de index.html: nombres, mensaje de bienvenida, meses de fiestas y feriados nacionales. Las fechas MM-DD se repiten; las YYYY-MM-DD sirven para puentes y traslados confirmados.</p><p class="muted" style="margin-top:12px">Carnaval y Viernes Santo se calculan cada año. Los demás feriados móviles y días turísticos requieren revisar el calendario oficial. No asumimos traslados futuros.</p><h3 style="margin-top:26px">Sus datos no salen de acá</h3><p class="muted">Sin cuentas, sin claves, sin analítica, sin servicios externos ni fuentes remotas. Las fotos se reducen a ${CONFIG.maxFotoPx} px como máximo. Hagan un respaldo antes de cambiar de celular o borrar datos.</p></div></div>`;}
function changeTheme(t){if(update(s=>s.settings.theme=t)){setTheme();refresh();}}
function dataPackage(){if(corruptState)throw new Error('Los datos locales no se pudieron leer. Descargá la copia de recuperación desde Ajustes.');const photos={};for(const p of state.photos){if(!images[p.id])throw new Error('Falta una foto en el almacenamiento. No se exportó un respaldo incompleto.');photos[p.id]=images[p.id];}return {app:'nosotros-web',version:1,exportedAt:new Date().toISOString(),state:clone(state),images:photos};}
function downloadRecovery(){if(preservedRaw!==null){downloadBlob(new Blob([preservedRaw],{type:'application/json'}),'nosotros-recuperacion-'+today()+'.json');toast('Copia de recuperación descargada sin modificar los datos originales.');}}
async function exportData(){try{const data=dataPackage();downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'nosotros-respaldo-'+today()+'.json');toast('Respaldo completo descargado. Guardalo en un lugar seguro.');return true;}catch(e){toast(e.message);return false;}}
// Importación estricta: solo campos conocidos, IDs seguros, fechas reales y fotos raster locales. Nunca HTML ni URLs remotas.
function validatePackage(raw, metadataOnly=false){if(!raw||raw.app!=='nosotros-web'||raw.version!==1||!raw.state||!raw.images||typeof raw.images!=='object'||Array.isArray(raw.images))throw new Error('Este archivo no es un respaldo compatible de Nosotros.');const s=raw.state,clean=EMPTY(),seen=new Set();const text=(v,max=5000)=>{if(typeof v!=='string'||v.length>max)throw new Error('Hay un texto inválido o demasiado largo.');return v;};const id=v=>{if(typeof v!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(v))throw new Error('Identificador inválido.');return v;};const date=v=>{if(!validDate(v))throw new Error('El respaldo tiene una fecha inválida.');return v;};const category=v=>{if(!CATS.some(c=>c[0]===v))throw new Error('Categoría desconocida.');return v;};const list=(a,max=20000)=>{if(!Array.isArray(a)||a.length>max)throw new Error('El respaldo tiene una lista inválida o demasiado grande.');return a;};const unique=(v,prefix)=>{id(v);if(seen.has(prefix+v))throw new Error('Hay identificadores duplicados.');seen.add(prefix+v);return v;};const num=(v,min,max)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)throw new Error('Encuadre o valor numérico inválido.');return v;};
clean.ideas=list(s.ideas).map(i=>{if(!i||typeof i.done!=='boolean')throw new Error('Idea inválida.');const url=safeURL(text(i.url,2000));if(url===null)throw new Error('Enlace no permitido en el respaldo.');return {id:unique(i.id,'i'),title:text(i.title,500),category:category(i.category),url,done:i.done};});
clean.events=list(s.events).map(e=>{if(!e||!['planned','done','cancelled'].includes(e.status)||typeof e.time!=='string'||!(e.time===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time)))throw new Error('Actividad inválida.');return {id:unique(e.id,'e'),title:text(e.title,180),date:date(e.date),time:e.time,category:category(e.category),notes:text(e.notes),status:e.status,ideaId:e.ideaId?id(e.ideaId):null};});
const importedImages={};clean.photos=list(s.photos,1000).map(p=>{const photoId=unique(p.id,'p'),data=raw.images[photoId];if(!metadataOnly&&(typeof data!=='string'||data.length>8*1024*1024||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)))throw new Error('Falta una foto o su formato no es seguro.');importedImages[photoId]=data;return {id:photoId,caption:text(p.caption,300),date:date(p.date),rotation:num(p.rotation,-5,5)};});
for(const key of ['days','notes']){if(!s[key]||typeof s[key]!=='object'||Array.isArray(s[key]))throw new Error('Notas inválidas.');if(Object.keys(s[key]).length>30000)throw new Error('Demasiadas notas.');for(const [k,v] of Object.entries(s[key])){date(k);if(key==='notes')clean.notes[k]=text(v);else{if(!v||('meet' in v&&typeof v.meet!=='boolean'))throw new Error('Día inválido.');clean.days[k]={meet:!!v.meet,note:text(v.note||'')};}}}
const c=s.collage;if(!c||!Number.isInteger(c.template)||c.template<0||c.template>=TEMPLATES.length||!c.slots||typeof c.slots!=='object'||Array.isArray(c.slots))throw new Error('Collage inválido.');clean.collage={template:c.template,caption:text(c.caption,120),slots:{}};for(const [k,slots] of Object.entries(c.slots)){if(!/^[0-4]$/.test(k))throw new Error('Plantilla desconocida.');clean.collage.slots[k]=list(slots,TEMPLATES[Number(k)].slots.length).map(slot=>{if(!slot)return null;if(!clean.photos.some(p=>p.id===slot.photoId))throw new Error('Un collage apunta a una foto inexistente.');return {photoId:id(slot.photoId),x:num(slot.x,0,100),y:num(slot.y,0,100),zoom:num(slot.zoom,1,3)};});}
if(!s.settings||!['auto','fiestas','romantico'].includes(s.settings.theme))throw new Error('Tema inválido.');clean.settings={theme:s.settings.theme};return {state:clean,images:importedImages};}
$('#importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>100*1024*1024)throw new Error('El respaldo supera 100 MB.');const candidate=validatePackage(JSON.parse(await file.text()));await Promise.all(Object.values(candidate.images).map(loadImage));modal('Recuperar sus recuerdos',`<p>El archivo tiene <b>${candidate.state.events.length} actividades, ${candidate.state.ideas.length} ideas y ${candidate.state.photos.length} fotos</b>.</p><div class="notice warn" style="margin-top:16px">Reemplazará los datos de este navegador. No combina cambios. Primero se descargará un respaldo de lo que tienen acá; verificá que el navegador permita guardarlo.</div><div class="form-actions"><button class="btn soft" onclick="closeModal()">Cancelar</button><button class="btn primary" id="confirmImport">Respaldar e importar</button></div>`);$('#confirmImport').onclick=async()=>{const button=$('#confirmImport');button.disabled=true;try{if(corruptState){downloadRecovery();}else if(!await exportData())throw new Error('Guardá un respaldo local válido antes de importar.');const old=clone(state),oldImages={...images};if(candidate.state.photos.length&&!db)throw new Error('No se puede importar fotos: IndexedDB está bloqueado.');if(db)await photoTransaction(store=>{store.clear();Object.entries(candidate.images).forEach(([id,data])=>store.put(data,id));});if(!commit(candidate.state,true)){if(db)await photoTransaction(store=>{store.clear();Object.entries(oldImages).forEach(([id,data])=>store.put(data,id));});state=old;throw new Error('No se importó: no hay espacio para los datos. Se restauraron las fotos anteriores.');}images=candidate.images;decoded.clear();closeModal();setTheme();refresh();toast('Todos sus recuerdos fueron importados ♥');}catch(error){toast(error.message);button.disabled=false;}};}catch(error){toast('No se importó: '+error.message);}};
// La inicialización y persistencia compartida se realizan en sync.js.
</script>
<script src="/sync.js"></script>
